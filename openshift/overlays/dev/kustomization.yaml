# Dev overlay, small, chatty, and deliberately destructible.
#
#     oc apply -k openshift/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reemostat-dev
namePrefix: ""

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/environment: dev

# One replica of everything. Dev exists to exercise correctness, not
# concurrency, and two replicas of nine services on a shared cluster is a
# lot of scheduling for no extra signal.
#
# The exception worth knowing: with api-gateway at one replica, the
# cross-replica idempotency behaviour is NOT being exercised here. That is
# what docker-compose runs two gateways for, and what tests/e2e covers.
replicas:
  - {name: api-gateway, count: 1}
  - {name: auth-service, count: 1}
  - {name: transaction-service, count: 1}
  - {name: risk-service, count: 1}
  - {name: ledger-service, count: 1}

configMapGenerator:
  - name: microfinance-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      # Tighter velocity thresholds so the risk paths are reachable by hand
      # without scripting twenty requests.
      - RISK_VELOCITY_DECLINE_COUNT=3
      - RISK_VELOCITY_REVIEW_COUNT=2

patches:
  # Enable the ledger wipe endpoint. Dev only, and absent from the base
  # precisely so it cannot reach production by being forgotten.
  - target: {kind: Deployment, name: ledger-service}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: ALLOW_LEDGER_RESET, value: "1"}

  # Ephemeral HSM key: swap the PVC for an emptyDir, keeping the mount.
  #
  # This previously REMOVED the volume and its mount, which was a bug. The
  # container still had HSM_KEY_PERSISTENCE_PATH=/var/hsm/base-key.enc in its
  # environment, so MockHSM tried to write into a directory that no longer
  # existed and died with FileNotFoundError at startup. That is what made
  # `oc set volume deployment/iso8583-adapter --add --type=emptyDir` necessary
  # by hand after every deploy, and that imperative patch was silently
  # reverted by the next `oc apply -k`.
  #
  # An emptyDir keeps the path valid and still gives the intended behaviour:
  # the volume dies with the pod, so the base key is regenerated on every
  # restart. Fine in dev, where nothing needs to survive a redeploy.
  - target: {kind: Deployment, name: iso8583-adapter}
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1
        value:
          name: hsm-key
          emptyDir: {}

  # minAvailable: 1 against a single replica means a node drain can NEVER
  # evict this pod, the budget is unsatisfiable, so the drain blocks
  # indefinitely. Dev runs one replica, so the budget has to allow zero.
  - target: {kind: PodDisruptionBudget, name: api-gateway}
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Autoscaling off. An HPA fighting a fixed replica count produces
  # confusing churn in an environment nobody is load-testing.
  - target: {kind: HorizontalPodAutoscaler, name: api-gateway}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: {kind: HorizontalPodAutoscaler, name: transaction-service}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Sync every 15 minutes instead of hourly, so analytics changes are
  # observable within a working session.
  - target: {kind: CronJob, name: analytics-sync}
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "*/15 * * * *"
