# In-cluster image builds, from Git.
#
#     oc apply -f openshift/build/build.yaml
#     bash scripts/openshift-build.sh
#
# GIT SOURCE, not binary. The cluster clones github.com/vmelonn/microfinance-microservices.git
# at ref `main` and builds from it, which means:
#
#   - every image is traceable to a commit; `oc describe build/<name>-3`
#     names the exact SHA it came from
#   - no local container engine, and no upload, the cluster pulls
#   - a webhook can rebuild automatically on push (see the bottom of this file)
#
# BINARY OVERRIDE, when you need it. `oc start-build <svc> --from-dir=.`
# still works against a Git-source BuildConfig: it uploads your working tree
# and builds that instead, ignoring Git for that one run. Use it while
# iterating on something uncommitted; never rely on it for anything you need
# to reproduce, because the resulting image corresponds to no commit at all.
#
# WHY THESE ARE DECLARED RATHER THAN `oc new-app`d
#
# `oc new-app <repo> --strategy=docker --context-dir=services/api-gateway`
# is the obvious one-liner and it does NOT work here. --context-dir sets the
# build context AND the Dockerfile location together, so the build would run
# with services/api-gateway/ as its root, and every Dockerfile in this repo
# needs the REPOSITORY ROOT as context, because each image installs
# libs/mfcommon as a real package rather than reaching it through a sys.path
# hack.
#
# What is needed is contextDir unset (root) with dockerfilePath pointing into
# the subdirectory. That combination has no `oc new-app` flag, which is why
# these are declared explicitly. Nine near-identical objects is also easier
# to review and re-apply than nine slightly different command lines.

---
# api-gateway, The only service with a Route.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: microfinance
spec:
  # Lets other objects in this namespace reference the tag by bare name.
  # Deployments additionally need the resolve-names annotation on the pod
  # template, both halves are required, and openshift/base/ carries the
  # other one. Missing either produces an identical ImagePullBackOff.
  lookupPolicy:
    local: true

---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: microfinance
spec:
  source:
    type: Git
    git:
      uri: https://github.com/vmelonn/microfinance-microservices.git
      ref: main
    # contextDir is deliberately UNSET. The build context is the repository
    # root; see the note at the top of this file.
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: services/api-gateway/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: api-gateway:latest
  triggers:
    # Rebuild when this BuildConfig itself changes.
    - type: ConfigChange
    # Rebuild on push. Inert until the webhook URL is registered in GitHub,
    # see the instructions at the bottom of this file.
    - type: GitHub
      github:
        secretReference:
          name: github-webhook-secret
  # A stuck build FAILS instead of hanging forever.
  #
  # Without this, a build pod that never gets scheduled, because the
  # namespace quota is full, which is easy to hit on a sandbox cluster, sits
  # Pending indefinitely, and `oc start-build --follow` waits for logs that
  # never arrive. That is how a CI job burns five hours and is then killed by
  # GitHub's own limit with nothing useful in the log.
  #
  # The deadline covers time spent Pending, not just running, which is
  # exactly the case that needs catching.
  completionDeadlineSeconds: 900     # 15 minutes

  resources:
    # Sized DOWN deliberately. These are modest pip installs, and the previous
    # 512Mi/2Gi meant nine concurrent builds asked for 4.5Gi of requests and
    # 18Gi of limits at once, more than a sandbox namespace is granted, so
    # the scheduler refused and every build hung.
    #
    # Not a floor to keep lowering: too little and the build is OOM-killed
    # with a message about the compiler rather than about memory.
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Retention kept deliberately tight. At 3 successful + 5 failed across nine
  # BuildConfigs this retained up to 72 build pods, which buried the console's
  # pod list and bloated etcd for no benefit, the build logs that matter are
  # already captured in the CI job output.
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 2

