# In-cluster image builds.
#
#     oc apply -f openshift/build/build.yaml
#     bash scripts/openshift-build.sh
#
# BINARY BUILDS, not Git-triggered builds. `oc start-build --from-dir=.`
# uploads the working tree to the cluster and builds there, which means:
#
#   - no local container engine is needed (useful when Docker Desktop is not
#     running, and when the cluster architecture differs from the laptop's)
#   - uncommitted work can be deployed, which is what you want while
#     iterating and emphatically not what you want for production
#
# For production, switch source.type to Git with a ref and a webhook so an
# image is always traceable to a commit. The binary flow deliberately has no
# such traceability -- that is the trade.
#
# WHY dockerfilePath POINTS INTO services/ : every Dockerfile expects the
# REPOSITORY ROOT as its build context, because each image installs
# libs/mfcommon as a real package. Build the whole tree, name the Dockerfile
# within it.

---
# api-gateway -- The only service with a Route.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: microfinance
spec:
  # Lets other objects in this namespace reference the tag by bare name.
  # Deployments additionally need the resolve-names annotation on the pod
  # template -- both halves are required, and the manifests in
  # openshift/base/ carry the other one.
  lookupPolicy:
    local: true

---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: microfinance
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: services/api-gateway/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: api-gateway:latest
  resources:
    # Builds are short-lived but pip-heavy. Too little memory and the build
    # pod is OOM-killed with a message about the compiler, not about memory.
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 5

