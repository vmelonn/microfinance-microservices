  # GitHub's own limit with nothing useful in the log.
  #
  # The deadline covers time spent Pending, not just running, which is
  # exactly the case that needs catching.
  completionDeadlineSeconds: 900     # 15 minutes

  resources:
    # Sized DOWN deliberately. These are modest pip installs, and the previous
    # 512Mi/2Gi meant nine concurrent builds asked for 4.5Gi of requests and
    # 18Gi of limits at once, more than a sandbox namespace is granted, so
    # the scheduler refused and every build hung.
    #
    # Not a floor to keep lowering: too little and the build is OOM-killed
    # with a message about the compiler rather than about memory.
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Retention kept deliberately tight. At 3 successful + 5 failed across nine
  # BuildConfigs this retained up to 72 build pods, which buried the console's
  # pod list and bloated etcd for no benefit, the build logs that matter are
  # already captured in the CI job output.
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 2

---
# Shared secret for the GitHub webhook triggers above.
#
# PLACEHOLDER. Replace it before registering any webhook, anyone holding
# this value can trigger builds in your namespace:
#
#     oc create secret generic github-webhook-secret \
#       --from-literal=WebHookSecretKey="$(openssl rand -hex 20)" \
#       --dry-run=client -o yaml | oc apply -f -
#
# Then, for each service, get its webhook URL and add it in GitHub under
# Settings -> Webhooks (content type: application/json):
#
#     oc describe bc/api-gateway | grep -A1 'Webhook GitHub'
#
# Nine services means nine webhooks, which is tedious. A reasonable
# alternative for a repo this size is to skip webhooks entirely and rebuild
# explicitly with `make oc-build`, nine services rarely all need rebuilding
# on every push anyway, and an explicit build is one fewer moving part.
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  annotations:
    microfinance.io/warning: "Placeholder. Replace before registering a webhook."
type: Opaque
stringData:
  WebHookSecretKey: "REPLACE-ME-openssl-rand-hex-20"
