# Secret bootstrap, applied ONCE, by hand, never by `oc apply -k`.
#
# Deliberately OUTSIDE openshift/base/ and absent from kustomization.yaml.
# When it lived in the base, every deploy overwrote the real generated values
# with these placeholders, which broke things quietly: tokens issued before a
# deploy stopped verifying after it, and a rotated HSM_MASTER_KEY_HEX made
# every PIN block encrypted under the previous one permanently undecryptable.
#
# PREFERRED, generate real values, never commit them:
#
#   oc create secret generic microfinance-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=HSM_MASTER_KEY_HEX="$(openssl rand -hex 32)" \
#     --from-literal=CLICKHOUSE_PASSWORD="" \
#     --dry-run=client -o yaml | oc apply -f -
#
# This file exists so the required KEYS are documented and a fresh cluster has
# something to apply. Anything real should come from Sealed Secrets, External
# Secrets, or the cluster's vault integration.
#
# stringData rather than data, so a typo is visible in review instead of
# hiding inside base64 until a pod fails at runtime.
apiVersion: v1
kind: Secret
metadata:
  name: microfinance-secrets
  annotations:
    microfinance.io/warning: "Placeholders. Generate real values before any real use."
type: Opaque
stringData:
  # Signs every JWT. api-gateway and auth-service MUST share it, a token
  # issued by one has to verify on the other. Rotating it invalidates every
  # live session at once, so a real rotation needs a two-key overlap period.
  JWT_SECRET: "REPLACE-ME-openssl-rand-hex-32"

  POSTGRES_PASSWORD: "REPLACE-ME"

  # 32 bytes of hex, wrapping the HSM base key.
  #
  # LOSING THIS IS UNRECOVERABLE. It decrypts the persisted base key, from
  # which every per-transaction PIN key is derived. Without it the persistence
  # file is inert and the adapter silently falls back to an ephemeral key,
  # so PIN blocks encrypted before the loss can never be decrypted again.
  # Back it up somewhere that is not this cluster.
  HSM_MASTER_KEY_HEX: "REPLACE-ME-openssl-rand-hex-32"

  CLICKHOUSE_PASSWORD: ""
