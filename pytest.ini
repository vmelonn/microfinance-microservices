[pytest]
# Each service is its own application with its own `app` package, so they
# cannot all be on sys.path simultaneously -- two services' `app.main` would
# collide. The Makefile therefore runs pytest once per service with that
# service's directory on PYTHONPATH.
#
# `make test` is the supported way to run everything. Running bare `pytest`
# from the repo root collects the shared suites (libs/, tests/) and will
# fail on the per-service ones for exactly that reason.
testpaths =
    libs/mfcommon/tests
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    e2e: requires the full docker-compose stack to be running
    slow: takes more than a couple of seconds

filterwarnings =
    error::DeprecationWarning
    # Starlette's TestClient still imports httpx in a way its own deprecation
    # warning complains about. Not ours to fix, and failing the suite on a
    # third-party deprecation would mean pinning an old FastAPI.
    ignore::UserWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
