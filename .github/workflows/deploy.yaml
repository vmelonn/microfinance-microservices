name: OpenShift CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-and-test:
    name: Deploy to OpenShift and Run Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI (oc)
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f oc.tar.gz README.md

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: true

      - name: Apply Kubernetes Configurations
        run: |
          oc apply -k openshift/overlays/dev

      - name: Trigger Builds and Wait
        run: |
          # Trigger builds one by one and follow their progress
          for svc in api-gateway auth-service ledger-service iso8583-adapter risk-service transaction-service; do
            echo "Starting build for $svc..."
            oc start-build $svc --follow
          done
          
          echo "All builds complete. Waiting for rollouts to complete..."
          for svc in api-gateway auth-service ledger-service iso8583-adapter risk-service transaction-service; do
            oc rollout status deployment/$svc --timeout=3m
          done

      - name: Run End-to-End Smoke Test
        run: |
          echo "Injecting smoke test into the API Gateway..."
          GATEWAY_POD=$(oc get pods -l app.kubernetes.io/name=api-gateway -o jsonpath='{.items[0].metadata.name}')
          ROUTE_URL="https://$(oc get route api-gateway -o jsonpath='{.spec.host}')"
          
          oc cp scripts/smoke_test.py $GATEWAY_POD:/tmp/smoke_test.py
          oc exec $GATEWAY_POD -- python /tmp/smoke_test.py --base "$ROUTE_URL"
