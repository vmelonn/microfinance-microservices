name: OpenShift CI/CD

on:
  push:
    branches: [main]
    # Changes that cannot affect what runs in the cluster do not deploy.
    # Nine cluster builds to publish a README edit is a waste of quota and,
    # on a constrained namespace, actively disruptive.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "PLAN.md"
      - ".gitignore"
  workflow_dispatch:        # re-run a deploy without an empty commit

# Also honoured: putting [skip ci] in a commit message skips the run
# entirely. GitHub handles that natively, useful for a commit that touches
# code but is not ready to go to the cluster.

# Two pushes in quick succession would otherwise race: one deploy rolling out
# while another rebuilds the images underneath it. Queue them instead.
concurrency:
  group: openshift-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Cheapest signal first: ten seconds of tests before spending nine
  # cluster builds finding out the code is broken.
  # ---------------------------------------------------------------------
  test:
    name: "1. Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -e "libs/mfcommon[dev]"
          pip install --quiet fastapi "uvicorn[standard]" httpx pydantic

      # A UTF-8 BOM in a workflow file makes GitHub fail to parse its `on:`
      # block. The workflow stays registered from whatever version last
      # parsed and simply stops being triggered, no error, no failed run,
      # nothing in the UI. It cost an afternoon of "why didn't the push do
      # anything", so it is now a hard failure at the cheapest possible spot.
      #
      # Root cause worth remembering: PowerShell 5.1's
      # `Set-Content -Encoding utf8` writes a BOM.
      - name: Reject UTF-8 BOMs
        run: |
          FOUND=$(find . -path ./.git -prune -o -type f \
                    \( -name '*.yaml' -o -name '*.yml' -o -name '*.py' \
                       -o -name '*.wsdl' -o -name '*.xsd' -o -name '*.sh' \) -print \
                  | xargs grep -lI $'\xef\xbb\xbf' 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::UTF-8 BOM found, GitHub cannot parse workflow files with one"
            echo "$FOUND" | sed 's/^/  /'
            exit 1
          fi
          echo "no BOMs"

      - name: Shared suites (mfcommon + DFDL conformance)
        run: pytest libs/mfcommon/tests tests -q

      - name: Per-service suites
        # Each service owns a top-level `app` package, so they cannot share a
        # sys.path, two services' app.main would shadow each other. Hence
        # one pytest run per service.
        run: |
          for svc in ace-stub ledger-service; do
            echo "=== $svc ==="
            PYTHONPATH="services/$svc" \
            WSDL_PATH="ace/Iso8583Library/wsdl/Iso8583Gateway.wsdl" \
            pytest "services/$svc/tests" -q -p no:cacheprovider
          done

  # ---------------------------------------------------------------------
  # ImageStreams, BuildConfigs, and the platform manifests.
  # ---------------------------------------------------------------------
  infrastructure:
    name: "2. Infrastructure"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # oc installed with curl rather than redhat-actions/openshift-tools-installer.
      # That action targets a deprecated Node runtime, races on the tool cache
      # when jobs run concurrently, and matches eleven candidate tarballs
      # before picking one, three of the four warnings on every run came
      # from it. This is four lines and has none of those failure modes.
      - name: Install oc
        run: |
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc
          oc version --client

      # `oc login` directly, rather than redhat-actions/oc-login, for the same
      # deprecated-runtime reason. The token is passed via the environment so
      # it never appears in a process listing; GitHub masks it in logs either
      # way.
      - name: Log in to OpenShift
        env:
          TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc login --token="$TOKEN" --server="$SERVER" --insecure-skip-tls-verify=true
          oc project "$NAMESPACE"

      # Create the Secret only if it is absent.
      #
      # It is no longer part of the kustomize base. When it was, every deploy
      # overwrote the real values with the repo's REPLACE-ME placeholders,
      # which silently invalidated every live JWT and, worse, made any PIN
      # block encrypted under the previous HSM_MASTER_KEY_HEX permanently
      # undecryptable.
      - name: Ensure secrets exist (never overwrite)
        run: |
          if oc get secret microfinance-secrets >/dev/null 2>&1; then
            echo "microfinance-secrets already exists, leaving it alone."
          else
            echo "creating microfinance-secrets with generated values"
            oc create secret generic microfinance-secrets \
              --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
              --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
              --from-literal=HSM_MASTER_KEY_HEX="$(openssl rand -hex 32)" \
              --from-literal=CLICKHOUSE_PASSWORD=""
          fi

      # Previously missing entirely, so `oc start-build` only worked because
      # the BuildConfigs had been created by hand. A fresh namespace failed.
      - name: Apply ImageStreams and BuildConfigs
        run: oc apply -f openshift/build/build.yaml

      # NOTE: the `sed -i '/fsGroup:/d'` step that used to live here is gone.
      # The manifests no longer set fsGroup at all, restricted-v2 allocates
      # one from the namespace range and rejects hardcoded values, so the
      # fix belonged at the source, not in a blind text delete across every
      # YAML file in the repo.
      - name: Apply platform manifests
        run: oc apply -k openshift/overlays/dev

      - name: Show quota headroom before building
        # Builds are the spikiest thing this pipeline does. Seeing the
        # namespace's remaining capacity here makes a later Pending build
        # immediately explicable rather than mysterious.
        run: |
          # THREE different objects can enforce limits and `oc get quota` shows
          # only the first. A Red Hat sandbox uses the second, which is why
          # that command printed nothing at all.
          echo "--- ResourceQuota (namespaced) ---"
          oc get resourcequota -o wide 2>/dev/null || echo "  none"
          echo "--- AppliedClusterResourceQuota (what a sandbox actually uses) ---"
          oc describe appliedclusterresourcequota 2>/dev/null || echo "  none"
          echo "--- LimitRange (per-pod defaults and ceilings) ---"
          oc get limitrange -o wide 2>/dev/null || echo "  none"

  # ---------------------------------------------------------------------
  # Nine images, three at a time.
  # ---------------------------------------------------------------------
  build:
    name: "3. Build"
    needs: infrastructure
    runs-on: ubuntu-latest
    # A build that cannot be scheduled used to hang until GitHub's 6-hour
    # ceiling. Generous for a pip install, fast to fail when something is
    # genuinely wrong.
    timeout-minutes: 20
    strategy:
      fail-fast: false        # one broken service should not hide the others
      # THE IMPORTANT ONE. Nine simultaneous build pods, on top of the twelve
      # already running, exceeded the namespace quota. The build pods were
      # never scheduled, sat Pending, and `--follow` waited for logs from a
      # pod that did not exist, five hours of nothing.
      #
      # Three at a time bounds the peak. Wall-clock time goes up; builds that
      # actually finish are worth more than builds that start in parallel and
      # hang.
      max-parallel: 3
      matrix:
        service:
          - api-gateway
          - auth-service
          - transaction-service
          - risk-service
          - ledger-service
          - iso8583-adapter
          - ace-stub          # the SOAP gateway, nothing works without it
          - host-simulator    # the switch, likewise
          - analytics-sync
    steps:
      - uses: actions/checkout@v4

      # oc installed with curl rather than redhat-actions/openshift-tools-installer.
      # That action targets a deprecated Node runtime, races on the tool cache
      # when jobs run concurrently, and matches eleven candidate tarballs
      # before picking one, three of the four warnings on every run came
      # from it. This is four lines and has none of those failure modes.
      - name: Install oc
        run: |
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc
          oc version --client

      # `oc login` directly, rather than redhat-actions/oc-login, for the same
      # deprecated-runtime reason. The token is passed via the environment so
      # it never appears in a process listing; GitHub masks it in logs either
      # way.
      - name: Log in to OpenShift
        env:
          TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc login --token="$TOKEN" --server="$SERVER" --insecure-skip-tls-verify=true
          oc project "$NAMESPACE"

      # --wait, NOT --follow.
      #
      # --follow streams the build pod's logs, so it blocks forever when the
      # pod is never scheduled: it waits on output from something that does
      # not exist, printing only "started" while it does. --wait polls the
      # Build's status instead, so Pending, Failed and Cancelled all resolve
      # properly, and completionDeadlineSeconds in build.yaml guarantees it
      # resolves at all.
      #
      # The cost is losing live log streaming. Logs are fetched on failure
      # below, which is when anyone actually reads them.
      - name: Build ${{ matrix.service }}
        run: |
          set -uo pipefail
          if oc start-build ${{ matrix.service }} --wait; then
            echo "build succeeded"
            exit 0
          fi

          echo "::error::build failed for ${{ matrix.service }}"
          BUILD=$(oc get builds -l buildconfig=${{ matrix.service }} \
                    --sort-by=.metadata.creationTimestamp \
                    -o jsonpath='{.items[-1:].metadata.name}')
          echo "--- status ---"
          oc describe build/"$BUILD" | tail -25
          echo "--- logs ---"
          oc logs build/"$BUILD" --tail=100 || echo "(no logs, the pod never started)"
          echo "--- quota (a Pending build is almost always this) ---"
          oc get resourcequota -o wide 2>/dev/null || true
          oc describe appliedclusterresourcequota 2>/dev/null || true
          exit 1

  # ---------------------------------------------------------------------
  # Roll out, wait, then prove it works.
  # ---------------------------------------------------------------------
  deploy:
    name: "4. Rollout and smoke test"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # oc installed with curl rather than redhat-actions/openshift-tools-installer.
      # That action targets a deprecated Node runtime, races on the tool cache
      # when jobs run concurrently, and matches eleven candidate tarballs
      # before picking one, three of the four warnings on every run came
      # from it. This is four lines and has none of those failure modes.
      - name: Install oc
        run: |
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc
          oc version --client

      # `oc login` directly, rather than redhat-actions/oc-login, for the same
      # deprecated-runtime reason. The token is passed via the environment so
      # it never appears in a process listing; GitHub masks it in logs either
      # way.
      - name: Log in to OpenShift
        env:
          TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc login --token="$TOKEN" --server="$SERVER" --insecure-skip-tls-verify=true
          oc project "$NAMESPACE"

      # Restart everything first, then wait for everything.
      #
      # Previously this restarted and waited service-by-service, which made
      # the worst case the SUM of eight timeouts, longer than the job's own
      # limit. Restarting all of them first makes it the slowest chain
      # instead. Dependency order still matters for restart (the switch and
      # the SOAP gateway first) but not for waiting: Kubernetes retries
      # readiness, so the adapter simply stays not-ready until ace-stub is up
      # and then goes ready on its own.
      - name: Restart deployments
        run: |
          set -euo pipefail
          for svc in host-simulator ace-stub iso8583-adapter \
                     ledger-service auth-service risk-service \
                     transaction-service api-gateway; do
            oc rollout restart deployment/$svc
          done

      # Polls explicitly instead of using `oc rollout status`.
      #
      # `oc rollout status` hung indefinitely on "Waiting for deployment spec
      # update to be observed", its --timeout applies to the watch, and a
      # watch that stops delivering events never fires it. This loop has a
      # hard wall-clock deadline it cannot miss, because it re-reads state
      # every five seconds rather than waiting to be told.
      #
      # This restores the approach the workflow originally had. Replacing it
      # with `oc rollout status` was a mistake: the hand-rolled version was
      # not working around flaky rollouts, it was working around a client
      # command that can hang.
      - name: Wait for rollouts
        run: |
          set -uo pipefail
          SERVICES="host-simulator ace-stub iso8583-adapter ledger-service
                    auth-service risk-service transaction-service api-gateway"
          DEADLINE=$(( SECONDS + 480 ))   # 8 minutes for the whole set
          PENDING="$SERVICES"

          while [ -n "${PENDING// /}" ] && [ "$SECONDS" -lt "$DEADLINE" ]; do
            STILL=""
            for svc in $PENDING; do
              # jsonpath returns an empty string for absent fields, so every
              # read is defaulted, an unset readyReplicas is 0, not a
              # syntax error in the arithmetic below.
              gen=$(oc get deploy "$svc" -o jsonpath='{.metadata.generation}' 2>/dev/null || echo 0)
              obs=$(oc get deploy "$svc" -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo -1)
              want=$(oc get deploy "$svc" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 1)
              ready=$(oc get deploy "$svc" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
              updated=$(oc get deploy "$svc" -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo 0)

              if [ "$obs" = "$gen" ] && [ "${ready:-0}" = "$want" ] && [ "${updated:-0}" = "$want" ]; then
                echo "  ready: $svc ($ready/$want)"
              else
                STILL="$STILL $svc"
              fi
            done
            PENDING="$STILL"
            [ -n "${PENDING// /}" ] && sleep 5
          done

          if [ -n "${PENDING// /}" ]; then
            echo "::error::rollout did not complete for:$PENDING"
            for svc in $PENDING; do
              echo "::group::$svc diagnostics"
              oc get deploy "$svc" -o wide || true
              oc describe deploy "$svc" | tail -25 || true
              oc get pods -l app.kubernetes.io/name="$svc" -o wide || true
              # --previous shows why the PRIOR container died, which is the
              # useful one once something has already restarted.
              oc logs deploy/"$svc" --tail=60 --all-containers 2>/dev/null || true
              oc logs deploy/"$svc" --tail=60 --previous 2>/dev/null || true
              echo "::endgroup::"
            done
            echo "--- events ---"
            oc get events --sort-by=.lastTimestamp | tail -30
            exit 1
          fi

          echo "all deployments rolled out"

      # From the runner against the public Route, not via `oc exec` into a
      # pod. Simpler, and it exercises the same path a real client takes,
      # through the Route and the router, instead of requiring a pod to
      # reach its own external hostname.
      - name: Smoke test
        run: |
          set -euo pipefail
          ROUTE="https://$(oc get route api-gateway -o jsonpath='{.spec.host}')"
          echo "target: $ROUTE"
          python scripts/smoke_test.py --base "$ROUTE" --insecure

      - name: Diagnostics on failure
        if: failure()
        run: |
          oc get pods -o wide
          oc get events --sort-by=.lastTimestamp | tail -40
