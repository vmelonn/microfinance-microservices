# Dependency updates, grouped so this does not become eight pull requests a
# week that nobody reads.
version: 2

updates:
  # `directories` with a glob, because dependencies are spread across ten
  # files: services/_base/requirements.txt holds what most services need
  # (fastapi, httpx, pydantic, uvicorn) and each service keeps what only it
  # uses. mfcommon has ZERO runtime dependencies on purpose, so only its dev
  # extra is ever updated here.
  - package-ecosystem: pip
    directories:
      - /services/*
      - /libs/mfcommon
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        # Majors are left out of the group deliberately. They are the ones
        # that need somebody to read a changelog, and burying a major in a
        # batch of patches is how it gets merged without that.
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  # The base image every service inherits from, plus each service's own
  # Dockerfile. A base bump reaches all nine at once, which is the point of
  # having a shared base.
  - package-ecosystem: docker
    directories:
      - /services/*
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
